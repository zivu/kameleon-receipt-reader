server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: none
        secure: true
spring:
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
  datasource:
    url: "jdbc:postgresql://ep-sweet-butterfly-zar5s5sv-pooler.c-2.eu-west-2.aws.neon.tech/neondb?sslmode=require&channelBinding=require"
    username: neondb_owner
    password: ${NEON_DB_PASS}
    driver-class-name: org.postgresql.Driver
  application:
    name: kameleon-receipts-reader
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 12MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: 500632763514-c9emfbg99m141n6lqndf47md81pnlgn0.apps.googleusercontent.com
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
logging:
  level:
    root: info
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: TRACE
    org.springframework.web.cors: DEBUG
    org:
      apache:
        coyote:
          http11: DEBUG
openai:
  api:
    url: https://api.openai.com/v1/chat/completions
    key: ${OPEN_API_KEY}
kameleon:
  redirect:
    url: http://localhost:4200
